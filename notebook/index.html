<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work">
<meta name="theme-color" content="#0f1722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>دفتر أيام العمل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
:root{
  --bg:#f3efe6;--card:#fffdf8;--ink:#23211c;--mute:#7a7467;--line:#e2dccd;
  --work:#2f7d5b;--off:#3b6ea5;--abs:#c2493d;--accent:#23211c;--accent-ink:#fffdf8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17160f;--card:#211f17;--ink:#f1ece0;--mute:#a39c8a;--line:#343125;
  --work:#4fb88a;--off:#6ea3dc;--abs:#e07366;--accent:#f1ece0;--accent-ink:#17160f;}}
:root[data-theme="dark"]{
  --bg:#17160f;--card:#211f17;--ink:#f1ece0;--mute:#a39c8a;--line:#343125;
  --work:#4fb88a;--off:#6ea3dc;--abs:#e07366;--accent:#f1ece0;--accent-ink:#17160f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:22px;font-weight:800;margin:0}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;font-family:inherit;cursor:pointer}
.month{font-weight:700;min-width:104px;text-align:center;font-size:17px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:14px}
.sum div{padding:12px 6px;text-align:center}
.sum div+div{border-inline-start:1px solid var(--line)}
.sum b{display:block;font-size:24px;font-weight:800}
.sum span{font-size:12.5px;color:var(--mute)}
.wage{width:100%;margin:-4px 0 14px;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.wage input{flex:1;max-width:130px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12.5px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.05;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:500;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.day.empty{visibility:hidden}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.w{background:var(--work);border-color:var(--work);color:#fff}
.day.o{background:var(--off);border-color:var(--off);color:#fff}
.day.a{background:var(--abs);border-color:var(--abs);color:#fff}
.day i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.legend{display:flex;gap:14px;justify-content:center;margin:12px 0 18px;font-size:13px;color:var(--mute)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--c)}
h2{font-size:16px;margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.row .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.row .t{flex:1}
.row .t small{color:var(--mute);display:block;font-size:13px}
.row .t div{font-weight:700}
.none{color:var(--mute);text-align:center;padding:18px 0;font-size:14.5px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.shade.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 12px;font-size:18px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px 4px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.chip.sel[data-s="w"]{background:var(--work);border-color:var(--work);color:#fff}
.chip.sel[data-s="o"]{background:var(--off);border-color:var(--off);color:#fff}
.chip.sel[data-s="a"]{background:var(--abs);border-color:var(--abs);color:#fff}
label{display:block;font-size:13.5px;color:var(--mute);margin:8px 0 4px}
.sheet input,.sheet textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.sheet textarea{min-height:84px;resize:vertical}
.hrs{display:flex;gap:8px;align-items:center}
.hrs button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;flex:none}
.hrs input{text-align:center}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.save{background:var(--accent);color:var(--accent-ink)}
.del{flex:0 0 auto!important;background:transparent;color:var(--abs);border:1px solid var(--line)!important}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--off);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.add{color:var(--mute);border-style:dashed}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.share button{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.share .wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:1}
.top{flex-wrap:wrap;row-gap:8px}
.nav{order:3;flex-basis:100%;justify-content:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:9px 13px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sheet{max-height:90vh;overflow-y:auto}
.stars{display:flex;justify-content:center;gap:4px;margin:6px 0 12px}
.stars button{background:none;border:0;font-size:40px;line-height:1;color:var(--line);cursor:pointer;padding:2px 4px}
.stars button.on{color:#f5b301}
.dayc{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.dayc.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nudge{display:block;width:100%;margin-bottom:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--abs);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14.5px;text-align:start;cursor:pointer}
.nudge[hidden]{display:none}
.aboutT{font-weight:800;font-size:16px;margin:24px 0 10px}
.about{padding:20px 14px 14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,var(--bg),var(--card));text-align:center}
.about .logo{width:56px;height:56px;margin:0 auto 10px;border-radius:16px;background:#0f1722;color:#5eead4;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(94,234,212,.3),0 8px 20px rgba(20,184,166,.2)}
.brand{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:25px;letter-spacing:.3px;direction:ltr}
.brand span{color:#14b8a6}
.aname{font-weight:800;margin-top:2px;font-size:16px}
.about p{margin:6px 0 14px;color:var(--mute);font-size:13.5px;line-height:1.7}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lk{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:800;font-size:14px}
.lk svg{flex:none}
.lk.site svg{color:#14b8a6}
.lk.yt svg{color:#ff0033}
.rights{margin-top:14px;font-size:12px;color:var(--mute);direction:ltr}
.top h1{flex:1;min-width:0;font-size:20px}
.top .ghost{margin-inline-end:8px}
.month{min-width:96px;font-size:16px}
.chip.sel[data-l]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 id="ttl">دفتر أيام العمل</h1>
    <button class="ghost" id="lang" aria-label="Language">🌐</button>
    <button class="ghost" id="gear" aria-label="Settings">⚙️</button>
    <div class="nav">
      <button id="prev">›</button>
      <div class="month" id="mname"></div>
      <button id="next">‹</button>
    </div>
  </div>

  <button class="nudge" id="nudge" hidden></button>
  <div class="tabs" id="tabs"></div>

  <div class="sum">
    <div><b id="sDays">0</b><span>أيام عمل</span></div>
    <div><b id="sHrs">0</b><span>ساعات</span></div>
    <div><b id="sPay">0</b><span>المبلغ</span></div>
  </div>
  <div class="wage"><div class="seg" id="pay"><button data-p="d"></button><button data-p="m"></button></div><input id="wage" type="number" inputmode="decimal" min="0" placeholder="اختياري"></div>

  <div class="grid" id="wds"></div>
  <div class="grid" id="grid" style="margin-top:5px"></div>
  <div class="legend">
    <span style="--c:var(--work)">عملت</span><span style="--c:var(--off)">إجازة</span><span style="--c:var(--abs)">غياب</span>
  </div>

  <h2>ملاحظات الشهر</h2>
  <div class="list" id="list"></div>
  <div class="share"><button class="wa" id="wa">إرسال بالواتساب</button><button id="pdf">تحميل PDF</button></div>
</div>

<div class="shade" id="shade">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="sTitle"></h3>
    <div class="chips" id="chips">
      <button class="chip" data-s="w">عملت</button>
      <button class="chip" data-s="o">إجازة</button>
      <button class="chip" data-s="a">غياب</button>
    </div>
    <div id="hrsBox">
      <label for="hrs">عدد الساعات</label>
      <div class="hrs">
        <button id="hm" aria-label="أقل">−</button>
        <input id="hrs" type="number" inputmode="decimal" min="0" max="24" step="0.5">
        <button id="hp" aria-label="أكثر">+</button>
      </div>
    </div>
    <label for="note">ملاحظة</label>
    <textarea id="note" placeholder="شو اشتغلت اليوم؟"></textarea>
    <div class="acts">
      <button class="save" id="save">حفظ</button>
      <button class="del" id="del">حذف</button>
    </div>
  </div>
</div>

<div class="shade" id="bShade"><div class="sheet" role="dialog" aria-modal="true">
  <h3 id="bTitle"></h3>
  <label for="bName">اسم القائمة (شخص أو شغلة)</label>
  <input id="bName" maxlength="30" placeholder="مثلاً: شغل مع أبو أحمد">
  <div class="acts"><button class="save" id="bSave">حفظ</button><button class="del" id="bDel">حذف</button></div>
</div></div>
<div class="shade" id="lShade"><div class="sheet" role="dialog" aria-modal="true">
  <h3 id="lTitle"></h3>
  <div class="chips" id="lChips">
    <button class="chip" data-l="ar">العربية</button>
    <button class="chip" data-l="he">עברית</button>
    <button class="chip" data-l="en">English</button>
  </div>
</div></div>
<div class="shade" id="gShade"><div class="sheet" role="dialog" aria-modal="true">
  <h3 id="gTitle"></h3>
  <label id="gContactL" for="gMail"></label>
  <div id="contactFields">
    <input id="gMail" type="email" inputmode="email" autocomplete="email">
  </div>
  <label id="gBackL" style="margin-top:16px"></label>
  <div class="share" style="margin-top:6px"><button id="gExport"></button><button id="gImport"></button></div>
  <input type="file" id="gFile" accept=".json,application/json" hidden>
  <div class="share" style="grid-template-columns:1fr;margin-top:8px"><button id="gCloud"></button></div>
  <div class="none" id="gStat" style="padding:8px 0 0;font-size:13px"></div>
  <div class="acts"><button class="save" id="gSave"></button></div>
  <div class="aboutT" id="remT"></div>
  <p id="remD" style="margin:0 0 10px;color:var(--mute);font-size:13.5px;line-height:1.6"></p>
  <div class="hrs" style="margin-bottom:10px"><input id="rTime" type="time" style="text-align:center"></div>
  <div id="rDays" style="display:flex;gap:6px;justify-content:center;margin-bottom:12px"></div>
  <div class="share" style="grid-template-columns:1fr;margin-top:0"><button id="remAdd"></button></div>
  <div class="share" style="grid-template-columns:1fr;margin-top:8px"><button id="pushBtn"></button></div>
  <div class="share" style="grid-template-columns:1fr;margin-top:8px"><button id="testNotifBtn">إرسال إشعار تجريبي الآن</button></div>
  <div class="none" id="pushStat" style="padding:6px 0 0;font-size:13px"></div>
  <div class="aboutT" id="homeT"></div>
  <p id="homeD" style="margin:0;color:var(--mute);font-size:13.5px;line-height:1.7"></p>
  <div class="aboutT" id="aTitle"></div>
  <div class="about">
    <div class="logo"><svg viewBox="0 0 48 48" width="30" height="30" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 14 8 24l10 10M30 14l10 10-10 10"/></svg></div>
    <div class="brand">Abd<span>Code</span></div>
    <div class="aname" id="aName"></div>
    <p id="aDesc"></p>
    <div class="links">
      <a class="lk site" href="https://abdcode.pages.dev" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="lkSiteT"></span></a>
      <a class="lk yt" href="https://www.youtube.com/@abdcode3" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9.2v5.6l5-2.8z" fill="#fff"/></svg><span id="lkYtT"></span></a>
    </div>
    <div class="rights" id="aRights"></div>
  </div>
</div></div>
<div class="shade" id="rShade"><div class="sheet" role="dialog" aria-modal="true">
  <h3 id="rTitle"></h3>
  <p id="rDesc" style="margin:0 0 8px;color:var(--mute);font-size:14px"></p>
  <div class="stars" id="stars" dir="ltr"><button data-r="1">★</button><button data-r="2">★</button><button data-r="3">★</button><button data-r="4">★</button><button data-r="5">★</button></div>
  <textarea id="rNote" maxlength="500"></textarea>
  <div class="acts"><button class="save" id="rSend"></button><button class="del" id="rLater" style="color:var(--mute)"></button></div>
</div></div>
<div id="toast"></div>
<script>
let MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
let WD=["ح","ن","ث","ر","خ","ج","س"];
let SN={w:"عملت",o:"إجازة",a:"غياب"};
const SC={w:"var(--work)",o:"var(--off)",a:"var(--abs)"};
const I={
ar:{title:"دفتر أيام العمل",days:"أيام عمل",hours:"ساعات",amount:"المبلغ",wageLbl:"أجرة اليوم:",wagePh:"اختياري",work:"عملت",off:"إجازة",abs:"غياب",notesH:"ملاحظات الشهر",wa:"إرسال بالواتساب",pdf:"تحميل PDF",hrsLbl:"عدد الساعات",noteLbl:"ملاحظة",notePh:"شو اشتغلت اليوم؟",save:"حفظ",del:"حذف",bName:"اسم القائمة (شخص أو شغلة)",bPh:"مثلاً: شغل مع أبو أحمد",langT:"اللغة",hr:"ساعة",empty:"اضغط على أي يوم لتسجّل فيه.",list:"قائمة",editList:"تعديل القائمة",newList:"قائمة جديدة",confirmDel:"تأكيد حذف القائمة وكل أيامها؟",day:"اليوم",status:"الحالة",hoursCol:"الساعات",noteCol:"ملاحظة",workDays:"أيام العمل",hoursTot:"الساعات",amountTot:"المبلغ",myBook:"دفتري",noRows:"ما في أيام مسجّلة بهالشهر",preparing:"عم بجهّز الـ PDF…",tapSend:"اضغط مرة ثانية للإرسال",noDl:"ما زبط التحميل هون",fail:"ما زبطت العملية",prev:"الشهر السابق",next:"الشهر التالي"},

}

};

function buildPDF(jp){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;

  off[2]=len;add("2 0 obj<</Type/Pages/Count "+jp.length+"/Kids["+jp.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"]>>endobj\n");
  jp.forEach((j,i)=>{
    const p=3+3*i,c=p+1,m=p+2,cs="q 595 0 0 842 0 0 cm /Im0 Do Q";
    off[p]=len;add(p+" 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 "+m+" 0 R>>>>/Contents "+c+" 0 R>>endobj\n");
    off[c]=len;add(c+" 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
    off[m]=len;add(m+" 0 obj<</Type/XObject/Subtype/Image/Width "+j.w+"/Height "+j.h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+j.b.length+">>stream\n");add(j.b);add("\nendstream endobj\n");
  });
  const x=len;let t="xref\n0 "+(n+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<=n;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer<</Size "+(n+1)+"/Root 1 0 R>>\nstartxref\n"+x+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function makePDF(){
  const rows=monthRows(),b=S.books[S.cur],T=totals();
  const F='Tajawal,Tahoma,"Segoe UI",Arial,sans-serif';
  try{await document.fonts.load('800 40px Tajawal');await document.fonts.load('500 30px Tajawal')}catch(e){}
  const W=1240,H=1754,PER=22,pages=Math.max(1,Math.ceil(rows.length/PER)),jp=[];
  for(let p=0;p<pages;p++){
    const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,W,H);g.direction=RTL?"rtl":"ltr";g.textAlign=RTL?"right":"left";
    g.fillStyle="#23211c";g.font="800 58px "+F;g.fillText(b.name,RTL?W-90:90,150);
    g.fillStyle="#7a7467";g.font="500 36px "+F;g.fillText(MONTHS[M]+" "+Y,RTL?W-90:90,208);
    const X=RTL?[W-90,W-340,W-500,W-640]:[90,340,500,640];
    g.fillStyle="#7a7467";g.font="700 30px "+F;
    [tr("day"),tr("status"),tr("hoursCol"),tr("noteCol")].forEach((h,i)=>g.fillText(h,X[i],300));
    g.fillStyle="#23211c";g.fillRect(90,322,W-180,3);
    rows.slice(p*PER,(p+1)*PER).forEach(([d,e],i)=>{
      const y=385+i*56;
      g.fillStyle="#23211c";g.font="500 32px "+F;g.fillText(d+" "+MONTHS[M],X[0],y);
      g.fillStyle={w:"#2f7d5b",o:"#3b6ea5",a:"#c2493d"}[e.s];g.font="700 32px "+F;g.fillText(SN[e.s],X[1],y);
      g.fillStyle="#23211c";g.font="500 32px "+F;g.fillText(e.s==="w"?String(e.h||0):"—",X[2],y);
      g.fillText((e.n||"").slice(0,60),X[3],y,560);
      g.fillStyle="#e2dccd";g.fillRect(90,y+16,W-180,2);
    });
    if(p===pages-1){
      g.fillStyle="#23211c";g.font="800 38px "+F;
      g.fillText(tr("workDays")+": "+T.days+"     "+tr("hoursTot")+": "+fmt(T.hrs)+(wage?"     "+tr("amountTot")+": "+fmt(amt(T.days)):""),RTL?W-90:90,1670);
    }
    if(pages>1){g.textAlign=RTL?"left":"right";g.fillStyle="#7a7467";g.font="500 28px "+F;g.fillText((p+1)+" / "+pages,RTL?90:W-90,1700)}
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
    jp.push({b:new Uint8Array(await blob.arrayBuffer()),w:W,h:H});
  }
  return buildPDF(jp);
}

function amt(days){return pay==="m"?+wage:days*(+wage)}

function emptyAll(){return Object.values(S.books).every(b=>!Object.keys(b.data||{}).length)}
function applyState(o){S=o;if(!S.me)S.me={email:""};load();$("wage").value=wage;persist();setLang(LANG)}

// ===== Rating (first open) =====
const API="";
const RATE_URL=API?API+"/rate":"";
const RK="workNotebook.rated",RQ="workNotebook.rq";
let stars=0;
function rateDone(){try{localStorage.setItem(RK,"1")}catch(e){}$("rShade").classList.remove("on")}
function showRate(){
  try{if(localStorage.getItem(RK))return;localStorage.setItem(RK,"1")}catch(e){return}
  setTimeout(()=>$("rShade").classList.add("on"),1500);
}
async function flushRatings(){
  if(!RATE_URL)return;
  let q=[];try{q=JSON.parse(localStorage.getItem(RQ)||"[]")}catch(e){}
  const left=[];
  for(const r of q){
    try{const res=await fetch(RATE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(r)});if(!res.ok)left.push(r)}
    catch(e){left.push(r)}
  }
  try{localStorage.setItem(RQ,JSON.stringify(left))}catch(e){}
}

// ===== Daily reminder (calendar file) + home-screen icon =====
const rem=()=>S.rem||(S.rem={time:"18:00",days:[0,1,2,3,4],notifEnabled:false,lastNotif:""});

  const r=rem();$("rTime").value=r.time||"18:00";

$("rDays").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;const r=rem(),d=+b.dataset.d;r.days=(r.days||[]).includes(d)?r.days.filter(x=>x!==d):r.days.concat(d);persist();b.classList.toggle("on")});
$("rTime").addEventListener("change",e=>{rem().time=e.target.value||"18:00";persist()});
$("remAdd").onclick=async()=>{

  const ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(hh)+p(mm)+"00";
  const n=new Date(),st=n.getUTCFullYear()+p(n.getUTCMonth()+1)+p(n.getUTCDate())+"T"+p(n.getUTCHours())+p(n.getUTCMinutes())+"00Z";
  const by=["SU","MO","TU","WE","TH","FR","SA"],txt=tr("remAsk");

// ===== Notifications (Local reminder + optional Push Worker) =====
const PUSH_OK="serviceWorker" in navigator&&"PushManager" in window;
const NOTIF_OK="Notification" in window;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const b64uToArr=s=>{const b=(s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");return Uint8Array.from(atob(b),c=>c.charCodeAt(0))};
function lastLogged(){let m="";Object.values(S.books).forEach(b=>Object.keys(b.data||{}).forEach(k=>{if(k>m)m=k}));return m}
let pushT=null;

async function showAppNotification(title,body){
  if(!NOTIF_OK||Notification.permission!=="granted")return false;
  try{
    if("serviceWorker" in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg&&typeof reg.showNotification==="function"){
        await reg.showNotification(title,{body,tag:"work-notebook-reminder"});
        return true;
      }
    }
  }catch(_){}
  try{new Notification(title,{body,tag:"work-notebook-reminder"});return true}catch(_){return false}
}

async function getSub(){
  if(!PUSH_OK)return null;
  try{const r=await navigator.serviceWorker.getRegistration();return r?await r.pushManager.getSubscription():null}catch(e){return null}
}
async function doSync(){
  if(!API)return;
  const sub=await getSub();if(!sub)return;const r=rem();
  try{caches.open("wn-meta").then(c=>c.put("lang",new Response(LANG)))}catch(e){}
  await fetch(API+"/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub:sub.toJSON(),time:r.time,days:r.days,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,lang:LANG,last:lastLogged()})});
}
function syncPush(){
  if(!API||!PUSH_OK||!NOTIF_OK||Notification.permission!=="granted")return;
  clearTimeout(pushT);pushT=setTimeout(()=>doSync().catch(()=>{}),1500);
}
async function refreshPush(){
  const r=rem();
  const isOn=!!(NOTIF_OK&&Notification.permission==="granted"&&r.notifEnabled);
  $("pushBtn").textContent=tr(isOn?"pushOff":"pushOn");
  if(!isOn){$("pushStat").textContent="";return}
  $("pushStat").textContent=API?tr("pushOk"):tr("pushNoApi");
}
async function enablePush(){
  if(!NOTIF_OK)return toast(tr("pushFail"));
  if(isIOS&&!standalone())return toast(tr("pushNeedHome"));
  try{
    const perm=Notification.permission==="granted"?"granted":await Notification.requestPermission();
    if(perm!=="granted")return toast(tr("pushDenied"));
    rem().notifEnabled=true;
    persist();
    if("serviceWorker" in navigator){
      try{await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready}catch(_){}
    }
    if(API){
      try{
        const reg=await navigator.serviceWorker.getRegistration();
        let sub=reg?await reg.pushManager.getSubscription():null;
        if(!sub&&reg){
          const key=(await (await fetch(API+"/vapid")).text()).trim();
          sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToArr(key)});
        }
        await doSync();
      }catch(_){}
    }
    refreshPush();
    toast(tr("pushOk"));
  }catch(e){toast(tr("pushFail"))}
}
async function disablePush(){
  rem().notifEnabled=false;
  persist();
  try{
    const sub=await getSub();
    if(sub){const ep=sub.endpoint;await sub.unsubscribe();if(API)fetch(API+"/unsub",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:ep})}).catch(()=>{})}
  }catch(_){}
  refreshPush();
}

function checkLocalReminder(){
  const r=rem();
  if(!r.notifEnabled||!NOTIF_OK||Notification.permission!=="granted")return;
  const nowD=new Date();
  const dayIdx=nowD.getDay();
  if(!(r.days||[]).includes(dayIdx))return;
  const [hh,mm]=(r.time||"18:00").split(":").map(Number);
  const nowMins=nowD.getHours()*60+nowD.getMinutes();
  const targetMins=(hh||0)*60+(mm||0);
  if(nowMins<targetMins)return;
  const todayKey=key(nowD.getFullYear(),nowD.getMonth(),nowD.getDate());
  if(r.lastNotif===todayKey)return;
  const hasTodayEntry=Object.values(S.books).some(b=>b.data&&b.data[todayKey]);
  if(hasTodayEntry)return;
  r.lastNotif=todayKey;
  persist();
  showAppNotification(tr("title"),tr("remAsk"));
}

$("pushBtn").onclick=async()=>{
  const r=rem();
  (NOTIF_OK&&Notification.permission==="granted"&&r.notifEnabled)?disablePush():enablePush();
};
$("testNotifBtn").onclick=async()=>{
  if(!NOTIF_OK)return toast(tr("pushFail"));
  if(Notification.permission!=="granted"){
    const perm=await Notification.requestPermission();
    if(perm!=="granted")return toast(tr("pushDenied"));
  }
  const ok=await showAppNotification(tr("title"),tr("remAsk"));
  toast(ok?"تم إرسال الإشعار التجريبي":tr("pushFail"));
};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
setInterval(checkLocalReminder,30000);
checkLocalReminder();
syncPush();
</script>
